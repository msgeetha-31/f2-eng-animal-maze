<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Maze</title>
<style>
/* Layout: status bar on top, one notebook-style card holding the maze canvas + D-pad; question and passage open as overlays */
:root{
  --night:#07140d; --leaf:#12301c; --moss:#2f6b3a; --lime:#b7e35a; --glow:#f4e66b;
  --paper:#f4f0e2; --ink:#1d2a1f; --muted:#5d6b5a; --line:#d6cdb0;
  --ok:#1f9d5c; --ok-soft:#dcf3e4; --bad:#d9443c; --bad-soft:#fbe2df; --amber:#f2a93b;
  --m1:#2f9e8f; --m1s:#dcf2ee; --m2:#d9822b; --m2s:#fbebd8; --m3:#8a5cc7; --m3s:#ece3f8;
  --font:"Times New Roman", Times, "Liberation Serif", serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:14pt;line-height:1.5;overflow-x:hidden;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 0%,#1d4a2b 0%,#0c2416 45%,var(--night) 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;box-shadow:inset 0 0 120px 30px #ff3b4e}
body.danger::after{animation:heartbeat 1s infinite}
@keyframes heartbeat{0%,100%{opacity:.12}15%{opacity:.7}30%{opacity:.22}45%{opacity:.55}}
h1,h2,h3{font-size:16pt;font-weight:bold;margin:0;line-height:1.3;text-wrap:balance}
button,input{font-family:var(--font);font-size:14pt;color:var(--ink)}
button{cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#flies,#confetti{position:fixed;inset:0;pointer-events:none}
#flies{z-index:0} #confetti{z-index:70}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco>div{position:absolute}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.status{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-radius:16px;padding:8px 14px;
  background:rgba(6,18,10,.88);color:#eef3d6;border:1px solid rgba(183,227,90,.35);box-shadow:0 0 24px rgba(183,227,90,.12),0 6px 0 #020604}
.status .item{display:flex;align-items:center;gap:6px;font-weight:bold}
.status .time{font-variant-numeric:tabular-nums;font-size:16pt;color:var(--glow);text-shadow:0 0 8px rgba(244,230,107,.55)}
.status .time.low{color:#ff5a5a;text-shadow:0 0 10px #ff3b4e;animation:tick 1s steps(1) infinite}
@keyframes tick{50%{opacity:.45}}
.mute{background:transparent;color:#eef3d6;padding:2px 6px;font-size:14pt}
.card{background:var(--paper);border-radius:22px;padding:clamp(14px,3.5vw,28px);display:flex;flex-direction:column;gap:14px;
  border-top:10px solid var(--rc,var(--lime));box-shadow:0 0 0 2px rgba(183,227,90,.25),0 24px 50px rgba(0,0,0,.65)}
.btn{background:var(--leaf);color:#fff;padding:10px 20px;font-weight:bold;box-shadow:0 4px 0 #061209;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #061209}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.hint{background:var(--glow);color:var(--ink);box-shadow:0 4px 0 #b9a63a}
.btn.go{background:var(--ok);box-shadow:0 4px 0 #13693c}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.zh{color:var(--muted);display:block}
.center{text-align:center;align-items:center}
.mascot{width:104px;height:104px;flex:none}
.mascot.bounce{animation:bounce .6s}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bounce{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.talk{display:flex;gap:12px;align-items:center}
.bubble{background:#e7efd2;border-radius:16px;padding:10px 14px;position:relative;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#e7efd2;border-left:0}
.namein{border:2px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;max-width:340px;background:#fff}
.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.mazes3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mchip{border-radius:14px;padding:10px;text-align:center;font-weight:bold;color:#fff}
.mchip small{display:block;font-weight:normal;font-size:14pt;opacity:.95}
.fb{border-radius:14px;padding:12px 16px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.hintbox{background:#fbf3c4} .fb.info{background:#e7efd2}
.fb b{display:block}
.float{position:fixed;font-weight:bold;font-size:16pt;color:#ff5a5a;pointer-events:none;z-index:90;animation:floatup 1.2s forwards;text-shadow:0 1px 0 #000}
.float.plus{color:var(--glow)}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:65;animation:fl .6s ease-out forwards}

/* maze screen */
.mhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--rs);color:var(--rc);font-weight:bold}
.gates{display:flex;gap:6px;align-items:center}

.gates i.d{background:var(--rc);border-color:var(--rc);color:#fff}

.stage canvas{display:block;width:100%;height:auto}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(6,18,10,.88);color:#eef3d6;border-radius:999px;padding:4px 14px;font-size:12pt;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.ctrl{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:6px}

.dpad button:active,.dpad button.on{transform:translateY(3px);box-shadow:0 1px 0 #061209}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}

.legend{font-size:12pt;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,8,4,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.ov.top{z-index:55}
.panel{width:100%;max-width:640px;background:var(--paper);border-radius:20px;padding:clamp(14px,3.5vw,26px);display:flex;flex-direction:column;gap:14px;

@keyframes rise{from{transform:translateY(24px);opacity:0}}

.ask{font-size:16pt;font-weight:bold}
.sentence{font-size:16pt;line-height:2.1;overflow-wrap:anywhere}
.blank{font-size:16pt;border:0;border-bottom:3px solid var(--rc);background:var(--rs);border-radius:8px 8px 0 0;padding:0 8px;text-align:center;max-width:100%}
.blank.right{border-color:var(--ok);background:var(--ok-soft)}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;font-size:14pt;display:flex;gap:10px;align-items:center}
.opt b{width:30px;height:30px;border-radius:50%;background:var(--rs);color:var(--rc);display:grid;place-items:center;flex:none}
.yn .opt{justify-content:center;font-weight:bold;font-size:16pt}
.opt:hover:not(:disabled){border-color:var(--rc)}
.opt.sel{border-color:var(--rc);background:var(--rs)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.lines4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lines4 .opt{justify-content:center;font-weight:bold}
.passage{background:#fffdf5;border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line)}
.passage h3{text-align:center}
.passage .by{text-align:center;color:var(--muted);margin-bottom:8px}
.pl{display:grid;grid-template-columns:34px 1fr;gap:0 8px;line-height:1.75}
.pl .n{color:#c0392b;text-align:right;font-variant-numeric:tabular-nums}
.pl .t.ind{text-indent:1.6em}
.pl .gap{grid-column:1/-1;height:6px}
.src{font-size:12pt;color:var(--muted);font-style:italic;text-align:right;margin-top:6px;overflow-wrap:anywhere}

/* intro / end */
.mintro{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sign{width:180px;height:auto}
.stars{font-size:16pt;letter-spacing:6px;color:#e2b100;text-shadow:0 2px 0 #9b7b00}
.stars .off{color:var(--line);text-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:#e7efd2;border-radius:14px;padding:10px}
.stat b{display:block;font-size:16pt;font-variant-numeric:tabular-nums}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.review li{background:#e7efd2;border-radius:12px;padding:10px 14px}
.chest{width:170px;margin:0 auto;filter:drop-shadow(0 0 18px #ffd65a)}
@media (max-width:560px){.mazes3,.stats{grid-template-columns:1fr}.mascot{width:78px;height:78px}.lines4{grid-template-columns:1fr 1fr}
  .dpad{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,54px)}.deco .vine{display:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

<div id="ovp" class="ov top" hidden></div>
<script>
// ===== Passage: "Animal Fun Facts" by Christine Leung (BI F2→F3 12.2, Unit 3) — line numbers match the worksheet =====
const PASSAGE=[
 [1,"I love animals! I’m always reading and watching documentaries to learn all I can",1],
 [2,"about as many animals as possible. From those, I’ve picked up some fun facts to"],
 [3,"share with everyone."],
 [4,"For instance, did you know that rats are the quickest natural breeders? In just 18",1],
 [5,"months, two rats can create over one million relatives! On the other hand one of the"],
 [6,"largest animals in the world, the blue whale, produces the loudest sound of any"],
 [7,"animal. The noise can be heard over 800 kilometres away, especially as sound"],
 [8,"travels quicker underwater."],
 [9,"If you’re like me, you’ll love lying on the bed on soft pillows under a fluffy",1],
 [10,"blanket. So imagine sleeping while standing up like horses and cows! Remember"],
 [11,"that buzzing sound that tells you a bee or mosquito is around? That’s from their"],
 [12,"wings beating so quickly that it makes noise."],
 [13,"Sharks may be scary, but they don’t have any bones at all and they lay the biggest",1],
 [14,"eggs of any animal in the world. A snake has transparent eyelids, so even when their"],
 [15,"eyes are closed, they can still see. Nothing is able to surprise a snake!"],
 [16,"Everyone has a favourite food. Now, imagine being able to eat as much as you want",1],
 [17,"just like a sheep, which has four stomachs to help it digest its food. A polar bear"],
 [18,"looks warm and fluffy, but it actually has black skin and transparent fur."],
 [19,"From the time it is born to old age, the average housefly only lives for two to",1],
 [20,"three weeks. Talk about fast living! Besides that, who doesn’t know about mosquito"],
 [21,"bites and the danger of dengue? What you might not know is that only female"],
 [22,"mosquitoes bite humans."],
 [23,"Finally, your cuddly pet cat, like all cats, is actually a very smart animal which",1],
 [24,"uses its whiskers to check if a space is too small for it to fit through before"],
 [25,"squeezing through or looking for a better exit. I hope these fun facts help you to see"],
 [26,"the animals around us in a new light!"]];

// ===== Questions 25–34 (answers + lines from the teacher's answer key) =====
const QS=[
 {id:"25",t:"fill",before:"The blue whale makes",after:"of any animal.",a:["the loudest sound","the loudest noise"],w:17,
  h:"Read paragraph 2. Find the part about the blue whale.",hz:"看第二段，找出关于蓝鲸的部分。",
  full:"The blue whale produces the loudest sound of any animal.",lines:["Lines 6–7"],lo:["Lines 4–5","Lines 6–7","Line 8","Lines 9–10"]},
 {id:"26",t:"yn",ask:"Do cows stand while sleeping?",yes:true,
  reasons:["They can sleep while standing up, like horses.","They sleep on soft pillows under a blanket.","They lie down on the bed to sleep.","They only sleep in the daytime."],
  h:"Read paragraph 3. Which animals sleep in an unusual way?",hz:"看第三段：哪些动物用特别的方式睡觉？",
  full:"Yes, they can sleep while standing up, like horses and cows.",lines:["Lines 9–10"],lo:["Lines 6–7","Lines 9–10","Lines 11–12","Line 16"]},
 {id:"27",t:"fill",before:"By",after:"their wings, bees make a buzzing sound.",a:["beating so quickly","beating quickly","beating very quickly"],w:18,
  h:"Read the end of paragraph 3, about the buzzing sound.",hz:"看第三段末尾，关于嗡嗡声的句子。",
  full:"The buzzing sound comes from their wings beating so quickly.",lines:["Lines 11–12"],lo:["Lines 9–10","Lines 11–12","Lines 13–14","Lines 21–22"]},
 {id:"28",t:"fill",before:"Sharks produce",after:"in the world.",a:["the biggest eggs","the largest eggs"],w:16,
  h:"Read paragraph 4. What do sharks lay?",hz:"看第四段：鲨鱼产下什么？",
  full:"Sharks lay the biggest eggs of any animal in the world.",lines:["Lines 13–14"],lo:["Lines 6–7","Lines 13–14","Lines 14–15","Line 17"]},
 {id:"29",t:"fill",before:"Even when a snake seems to be asleep, it is watching through",after:".",a:["transparent eyelids"],w:20,
  h:"Read the end of paragraph 4, about a snake’s eyes.",hz:"看第四段末尾，关于蛇的眼睛。",
  full:"A snake has transparent eyelids, so even when its eyes are closed, it can still see.",lines:["Lines 14–15"],lo:["Lines 9–10","Lines 13–14","Lines 14–15","Line 18"]},
 {id:"30",t:"fill",before:"Sheep have four stomachs to help them",after:"that they eat.",a:["digest the food","digest its food","digest their food","digest food"],w:16,
  h:"Read paragraph 5. Why does a sheep have four stomachs?",hz:"看第五段：羊为什么有四个胃？",
  full:"A sheep has four stomachs to help it digest its food.",lines:["Line 17"],lo:["Line 16","Line 17","Line 18","Lines 19–20"]},
 {id:"31",t:"yn",ask:"Do male mosquitoes bite humans?",yes:false,
  reasons:["Only female mosquitoes bite humans.","Only male mosquitoes bite humans.","All mosquitoes bite humans at night.","Mosquitoes only bite horses and cows."],
  h:"Read paragraph 6, about mosquito bites and dengue.",hz:"看第六段，关于蚊子叮咬和骨痛热症。",
  full:"No, only female mosquitoes bite humans.",lines:["Lines 21–22"],lo:["Lines 11–12","Lines 19–20","Lines 21–22","Lines 23–24"]},
 {id:"32",t:"fill",before:"A cat uses its",after:"to check if it can fit through a space.",a:["whiskers"],w:12,
  h:"Read the last paragraph, about the cuddly pet cat.",hz:"看最后一段，关于可爱的宠物猫。",
  full:"A cat uses its whiskers to check if a space is too small for it to fit through.",lines:["Line 24"],lo:["Line 17","Line 23","Line 24","Line 25"]},
 {id:"33",t:"word",mean:"to produce or make",a:["create"],w:12,
  h:"Look in paragraph 2: what can two rats do in 18 months?",hz:"看第二段：两只老鼠在 18 个月里能做什么？",
  full:"“Two rats can create over one million relatives!”",lines:["Line 5"],lo:["Line 2","Line 4","Line 5","Line 13"]},
 {id:"34",t:"word",mean:"furry, shaggy",a:["fluffy"],w:12,
  h:"Look at the blanket in paragraph 3, or the polar bear in paragraph 5.",hz:"看第三段的毯子，或第五段的北极熊。",
  full:"“…under a fluffy blanket” / “A polar bear looks warm and fluffy”",lines:["Line 9","Line 18"],lo:["Line 9","Line 17","Line 18","Line 23"]}
];
const MAZES=[
 {name:"Maze 1",title:"The River Trail",zh:"第一迷宫：河边小路",qs:[0,1,2,3],w:7,h:7,seed:101,c:"var(--m1)",s:"var(--m1s)",hex:"#2f9e8f"},
 {name:"Maze 2",title:"The Bamboo Forest",zh:"第二迷宫：竹林",qs:[4,5,6,7],w:8,h:8,seed:202,c:"var(--m2)",s:"var(--m2s)",hex:"#d9822b"},
 {name:"Maze 3",title:"The Treasure Cave",zh:"第三迷宫：宝藏洞穴",qs:[8,9],w:7,h:7,seed:303,c:"var(--m3)",s:"var(--m3s)",hex:"#8a5cc7"}];
const TOTAL_Q=QS.length, TOTAL_TIME=15*60, WRONG_PEN=15, HINT_PEN=10;

// ===== Helpers =====
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const FILLER=new Set(["the","a","an","its","their","them","his","her"]);
const norm=s=>(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim().split(" ").filter(w=>w&&!FILLER.has(w)).join(" ");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
// "right" | "close" (spelling slip, no penalty) | "wrong"
function mark(input,accepted){const v=norm(input);if(!v)return "empty";
  if(accepted.some(a=>norm(a)===v))return "right";
  return accepted.some(a=>{const n=norm(a);return n.length>=5&&lev(n,v)<=2;})?"close":"wrong";}

// ===== Sound (all generated live, no files) =====
let actx=null,muted=false,musicOn=true;
function ac(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();return actx;}
function tone(freqs,dur=.12,type="triangle",vol=.18){
  if(muted)return;try{const c=ac();
  freqs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    const t=c.currentTime+i*dur;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur*1.7);});}catch(e){}
}
function chirp(){if(muted)return;try{const c=ac();[0,.12].forEach(d=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+d;o.type="sine";
  o.frequency.setValueAtTime(1900,t);o.frequency.exponentialRampToValueAtTime(3000,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+.12);});}catch(e){}}
function creak(){if(muted)return;try{const c=ac(),o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;

const BGM={timer:null,step:0,next:0,bus:null,noise:null,
  MEL:[69,0,72,74,76,0,74,72, 69,0,67,69,72,0,0,0, 76,0,79,76,74,0,72,74, 76,0,74,72,69,0,0,0,
       81,0,79,76,79,0,76,74, 72,0,74,76,74,0,72,69, 67,0,69,72,74,0,76,74, 72,0,69,67,69,0,0,0],
  BASS:[45,45,41,43,45,41,43,45],
  hz:m=>440*Math.pow(2,(m-69)/12),
  start(){if(this.timer)return;try{const c=ac();
      if(!this.bus){this.bus=c.createGain();this.bus.connect(c.destination);
        const n=c.createBuffer(1,c.sampleRate*0.2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=n;}
      this.level();this.step=0;this.next=c.currentTime+0.1;this.timer=setInterval(()=>this.tick(),25);}catch(e){}},
  stop(){clearInterval(this.timer);this.timer=null;if(this.bus&&actx)this.bus.gain.setTargetAtTime(0,actx.currentTime,0.05);},
  level(){if(this.bus&&actx)this.bus.gain.setTargetAtTime(muted||!musicOn?0:.9,actx.currentTime,0.05);},
  tempo(){return (G.started&&G.timeLeft<=60&&G.phase!=="done"&&G.phase!=="over")?150:112;},
  tick(){const c=actx;
    while(this.next<c.currentTime+0.15){
      const s=this.step%64,t=this.next,dur=60/this.tempo()/2;
      const m=this.MEL[s];if(m){this.note("triangle",this.hz(m),t,dur*1.6,0.05);this.note("sine",this.hz(m+12),t,dur*0.6,0.015);}
      if(s%8===0)this.note("sine",this.hz(this.BASS[Math.floor(s/8)]),t,dur*3.5,0.12);
      if(s%8===5)this.note("sine",this.hz(this.BASS[Math.floor(s/8)]+7),t,dur*1.5,0.07);
      if(s%4===0)this.drum(t,s%8===0?120:180);
      this.shaker(t,s%2?0.02:0.035);
      this.step++;this.next+=dur;}},
  note(type,f,t,d,v){const c=actx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(this.bus);o.start(t);o.stop(t+d+0.02);},
  drum(t,f){const c=actx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.45,t+0.14);
    g.gain.setValueAtTime(0.13,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.connect(g).connect(this.bus);o.start(t);o.stop(t+0.2);},
  shaker(t,v){const c=actx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type="bandpass";f.frequency.value=6500;f.Q.value=1.5;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);s.connect(f).connect(g).connect(this.bus);s.start(t);s.stop(t+0.07);}
};

(function flies(){
  const c=$("flies");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const x=c.getContext("2d");let W,H;const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};fit();addEventListener("resize",fit);
  const ps=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:1.2+Math.random()*2,vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0006,d:Math.random()*6}));
  (function f(){x.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx+Math.sin(p.d)*.0004;p.y+=p.vy+Math.cos(p.d*.7)*.0003;p.d+=.015;
    if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
    const a=Math.max(0,Math.sin(p.d*2.2));const g=x.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.r*5);
    g.addColorStop(0,`rgba(244,240,120,${.9*a})`);g.addColorStop(1,"rgba(183,227,90,0)");x.fillStyle=g;x.beginPath();x.arc(p.x*W,p.y*H,p.r*5,0,7);x.fill();}
    requestAnimationFrame(f);})();
})();

  if(q.t==="yn"){CUR.order=shuffle(q.reasons.map((r,i)=>({r,i})));
    body=`<div class="ask">${esc(q.ask)}</div>
     <div class="yn"><button class="opt" data-yn="1">Yes</button><button class="opt" data-yn="0">No</button></div>
     <div><b>Choose the reason from the text:</b> <span class="muted">选出文章里的理由：</span></div>
     <div class="opts">${CUR.order.map((o,k)=>`<button class="opt" data-r="${o.i}"><b>${"ABCD"[k]}</b>${esc(o.r)}</button>`).join("")}</div>`;}
  ov.innerHTML=`<div class="panel" id="qp" role="dialog" aria-modal="true" aria-label="Gate question">
    <div class="phead"><span class="tag">🚪 Gate ${gi} · Question ${q.id}</span><button class="btn alt" id="qread">📜 Passage</button></div>
    ${body}
    <div id="fb" aria-live="polite"></div>
    <div class="row" id="acts"><button class="btn" id="chk">Check</button><button class="btn hint" id="hint">Hint (−10s)</button><button class="btn alt" id="later">Back to maze</button></div></div>`;
  $("qread").onclick=openPassage;
  $("chk").onclick=check;
  $("hint").onclick=()=>{if(G.hinted)return;G.hinted=true;penalty(HINT_PEN,$("hint"));showHint();$("hint").disabled=true;};
  $("later").onclick=()=>{closeQ();};
  const a=$("ans");if(a){a.addEventListener("keydown",e=>{if(e.key==="Enter"&&!G.solved){e.preventDefault();check();}});setTimeout(()=>a.focus(),50);}
  ov.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{if(G.solved)return;CUR.yn=b.dataset.yn==="1";ov.querySelectorAll("[data-yn]").forEach(x=>x.classList.toggle("sel",x===b));SFX.click();});
  ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(G.solved)return;CUR.reason=+b.dataset.r;ov.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("sel",x===b));SFX.click();});
}
function closeQ(){$("ovq").hidden=true;$("ovq").innerHTML="";if(G.phase==="q")G.phase="maze";CUR=null;}
function info(msg){const fb=$("fb");fb.className="fb info";fb.innerHTML=msg;}
function showHint(){const q=CUR.q,fb=$("fb");fb.className="fb hintbox";fb.innerHTML=`<b>💡 Hint</b>${esc(q.h)}<span class="zh">${esc(q.hz)}</span>`;}
function check(){
  if(!CUR||G.solved)return;const q=CUR.q;
  if(q.t==="yn"){
    if(CUR.yn===null||CUR.reason===null)return info("Choose <b style='display:inline'>Yes or No</b> and a reason first.<span class='zh'>请先选择 Yes / No 和一个理由。</span>");
    const okYN=CUR.yn===q.yes,okR=CUR.reason===0;
    $("ovq").querySelectorAll("[data-yn]").forEach(b=>{b.classList.remove("right","wrong");if(b.classList.contains("sel"))b.classList.add(okYN?"right":"wrong");});
    $("ovq").querySelectorAll("[data-r]").forEach(b=>{b.classList.remove("right","wrong");if(b.classList.contains("sel"))b.classList.add(okR?"right":"wrong");});
    return okYN&&okR?right():wrong();
  }
  const el=$("ans"),r=mark(el.value,q.a);
  if(r==="empty")return info("Type your answer first.<span class='zh'>请先输入答案。</span>");
  if(r==="close"){el.classList.remove("right","wrong");return info("<b>Almost! Check your spelling.</b> (No time lost.)<span class='zh'>差一点！检查一下拼写。（不扣时间）</span>");}
  el.classList.toggle("right",r==="right");el.classList.toggle("wrong",r!=="right");
  r==="right"?right():wrong();
}
function wrong(){
  SFX.bad();flash("bad");const q=CUR.q;
  if(!G.triedWrong){G.triedWrong=true;G.firstWrong.push(q.id);if(G.ref)G.ref.child("missed/"+q.id).set(true).catch(()=>{});}
  penalty(WRONG_PEN,$("acts"));if(G.phase==="over")return;
  const fb=$("fb");fb.className="fb no";fb.innerHTML=`<b>Not yet. Try again!</b>${esc(q.h)}<span class="zh">${esc(q.hz)}</span>`;
  const p=$("qp");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
  G.hinted=true;const h=$("hint");if(h)h.disabled=true;
}
function right(){
  if(G.solved)return;G.solved=true;SFX.ok();flash("good");const q=CUR.q;
  const pts=G.triedWrong?50:100;G.score+=pts;G.correct++;renderStatus();sync();floatText("+"+pts,$("acts"),true);
  $("ovq").querySelectorAll("#qp input, [data-yn], [data-r]").forEach(el=>el.disabled=true);
  const fb=$("fb");fb.className="fb ok";
  fb.innerHTML=`<div class="talk">${momo("happy","bounce")}<div><b>${G.triedWrong?"Well done! The gate opens.":"Excellent! First try!"}</b>${esc(q.full)}</div></div>`;
  // bonus: find the line
  const lo=q.lo;
  $("acts").innerHTML=`<div style="width:100%;display:flex;flex-direction:column;gap:8px">
     <div><b>🔑 Bonus key:</b> Which line tells you the answer? <span class="muted">答案在哪一行？</span></div>
     <div class="lines4">${lo.map(l=>`<button class="opt" data-l="${esc(l)}">${esc(l)}</button>`).join("")}</div>
     <button class="btn alt" id="skipb" style="align-self:flex-start">Skip bonus</button></div>`;
  $("ovq").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>lineAnswer(b.dataset.l));
  $("skipb").onclick=()=>lineAnswer(null);
}
function lineAnswer(l){
  const q=CUR.q,ok=l!==null&&q.lines.includes(l);
  $("ovq").querySelectorAll("[data-l]").forEach(b=>{b.disabled=true;if(q.lines.includes(b.dataset.l))b.classList.add("right");else if(b.dataset.l===l)b.classList.add("wrong");});
  if(ok){G.keys++;G.score+=50;SFX.key();floatText("+50 🔑",$("acts"),true);renderStatus();sync();}
  else if(l!==null){tone([300,240],.1,"sine",.12);if(G.ref)G.ref.child("lineMiss/"+q.id).set(true).catch(()=>{});}
  const msg=ok?`<b style="color:var(--ok)">🔑 Correct! You earned a bonus key.</b>`:`<b>The answer is in ${esc(q.lines.join(" or "))}.</b>`;
  const sk=$("skipb");if(sk)sk.remove();
  const box=document.createElement("div");box.style.cssText="display:flex;flex-direction:column;gap:10px;width:100%";
  box.innerHTML=`<div>${msg}</div><button class="btn go" id="cont" style="align-self:flex-start">Open the gate ▶</button>`;
  $("acts").firstElementChild.appendChild(box);
  $("cont").onclick=()=>{const g=CUR.gate;closeQ();openGateAnim(g);};$("cont").focus();
}
function openGateAnim(g){
  if(!MZ)return;g.open=true;creak();updGateChips();
  for(let i=0;i<22;i++)MZ.burst.push({x:g.x+.5,y:g.y+.5,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.1,life:1,c:i%3?"#8a5a2b":"#3f8a45"});
  const left=MZ.gates.filter(x=>!x.open).length,t=$("toast");
  if(t){t.textContent=left?`Gate open! ${left} more to go 🚪`:"All gates open — head for the exit ✨";t.style.opacity="1";setTimeout(()=>{if($("toast"))$("toast").style.opacity="0";},2600);}
  G.phase="maze";
}

// ===== End screens =====
function reviewHTML(){
  if(!G.firstWrong.length)return `<p style="margin:0"><b>Perfect! No mistakes on the first try.</b><span class="zh">太棒了！每一题第一次就答对。</span></p>`;
  return `<h3 style="align-self:flex-start">Review: questions you got wrong the first time <span class="zh">复习：第一次答错的题目</span></h3>
   <ul class="review">${G.firstWrong.map(id=>{const q=QS.find(x=>x.id===id);return `<li><b>Q${id}</b> ${esc(q.full)}<span class="zh">${esc(q.lines.join(" / "))} · ${esc(q.h)}</span></li>`}).join("")}</ul>`;
}
function stars(n){return `<div class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i=>i<n?"★":`<span class="off">★</span>`).join("")}</div>`;}
function win(){
  stopTimer();BGM.stop();stopMaze();closeOverlays();SFX.win();confetti();
  const used=TOTAL_TIME-G.timeLeft,bonus=G.timeLeft;G.score+=bonus;renderStatus();
  const w=G.firstWrong.length,n=w<=1&&G.timeLeft>=180?3:w<=4?2:1;
  G.phase="done";renderStatus();sync({state:"escaped",stars:n,timeUsed:used,finishedAt:LIVE_OK?firebase.database.ServerValue.TIMESTAMP:Date.now()});
  setColor(2);
  card.innerHTML=`<div class="center" style="display:flex;flex-direction:column;gap:14px">
    ${chestSVG}<h2>You found the treasure, ${esc(G.name)}!</h2><span class="muted">恭喜你走出丛林，找到宝藏！</span>
    ${stars(n)}
    <div class="stats"><div class="stat">Time used<b>${fmt(used)}</b></div><div class="stat">Score<b>${G.score}</b></div><div class="stat">Bonus keys<b>${G.keys}/${TOTAL_Q}</b></div></div>
    <p class="muted" style="margin:0">Score includes a time bonus of ${bonus} (1 point per second left) and ${G.flies} firefl${G.flies===1?"y":"ies"}.</p>
    ${reviewHTML()}
    ${endButtons("Play again")}</div>`;
  if($("again"))$("again").onclick=startScreen;
}
function timeUp(){
  if(G.phase==="over"||G.phase==="done")return;G.phase="over";stopMaze();closeOverlays();BGM.stop();SFX.bad();sync({state:"timeup",timeLeft:0});renderStatus();
  setColor(null);
  card.innerHTML=`<div class="center" style="display:flex;flex-direction:column;gap:14px">
    ${momo("sad","shake")}<h2>Time's up, ${esc(G.name)}!</h2><span class="muted">时间到了！别灰心，再试一次。</span>
    ${stars(0)}
    <div class="stats"><div class="stat">Gates opened<b>${G.correct}/${TOTAL_Q}</b></div><div class="stat">Score<b>${G.score}</b></div><div class="stat">Bonus keys<b>${G.keys}/${TOTAL_Q}</b></div></div>
    ${reviewHTML()}
    ${endButtons("Try again")}</div>`;
  if($("again"))$("again").onclick=startScreen;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#f4e66b","#2f9e8f","#d9822b","#8a5cc7","#b7e35a"];
  const ps=Array.from({length:160},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,a:Math.random()*6,col:cols[Math.floor(Math.random()*5)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});
    if(++t<260)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("ovp").hidden){$("ovp").hidden=true;$("ovp").innerHTML="";}});
startScreen();
</script>
</body>
</html>
