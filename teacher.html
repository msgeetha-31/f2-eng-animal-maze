<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Maze · Teacher</title>
<style>
/* Layout: teacher console for the projector — control bar on top, big join code in the lobby, live leaderboard + most-missed panel during play */
:root{
  --sky:#dcefff; --card:#ffffff; --ink:#1d2b4f; --muted:#5b6a8c; --line:#c9d9f0;
  --sun:#ffc93c; --ok:#21a46b; --ok-soft:#dcf6ea; --bad:#e04b4b; --bad-soft:#fde4e4;
  --r1:#3d7be0; --r2:#e2508a; --r3:#ec8417;
  --font:"Times New Roman", Times, "Liberation Serif", serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);font-size:14pt;line-height:1.45;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:18pt} h2{font-size:16pt} h3{font-size:14pt}
button{font-family:var(--font);font-size:14pt;cursor:pointer;border:0;border-radius:12px;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{background:var(--ink);color:#fff;padding:10px 18px;font-weight:bold;box-shadow:0 4px 0 #0b1530}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1530}
.btn.go{background:var(--ok);box-shadow:0 4px 0 #157a4e}
.btn.stop{background:var(--bad);box-shadow:0 4px 0 #a83232}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:10px 16px;box-shadow:0 6px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:bold;font-size:12pt}
.pill.lobby{background:#fff6d6;color:#8a6500}.pill.live{background:var(--ok-soft);color:var(--ok)}.pill.ended{background:#e6ebf3;color:var(--muted)}
.code{font-size:64pt;font-weight:bold;letter-spacing:12px;line-height:1;font-variant-numeric:tabular-nums}
.codebox{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.url{font-size:18pt;font-weight:bold;color:var(--r1)}
.join{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:40px}
.qr{display:flex;flex-direction:column;align-items:center;gap:6px}
.qr svg{width:min(300px,70vw);height:auto;background:#fff;border-radius:12px}
.grid>*,.join>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:var(--sky);border-radius:999px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:6px;font-weight:bold;animation:pop .35s}
.chip button,.x{background:transparent;padding:0 6px;color:var(--muted);font-size:14pt;line-height:1}
.chip button:hover,.x:hover{color:var(--bad)}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 6px 0 var(--line)}
.stat b{display:block;font-size:22pt;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:2.2fr 1fr;gap:16px;align-items:start}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12pt;color:var(--muted);font-weight:normal;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #e8eef8;vertical-align:middle}
tr.top td:first-child{font-weight:bold}
.rank{width:34px;font-weight:bold}
.name{font-weight:bold;min-width:120px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:#b8c3d6}
.prog{min-width:170px}
.track{height:12px;border-radius:99px;background:#e8eef8;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.prog small{color:var(--muted);font-size:11pt}
.st{font-size:12pt;font-weight:bold;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st.lobby{background:#fff6d6;color:#8a6500}.st.playing{background:var(--sky);color:var(--r1)}.st.escaped{background:var(--ok-soft);color:var(--ok)}
.st.timeup,.st.stopped{background:var(--bad-soft);color:var(--bad)}
.low{color:var(--bad);font-weight:bold}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.missed li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.missed .n{background:var(--bad-soft);color:var(--bad);font-weight:bold;border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums;text-align:center;min-width:44px}
.missed .t{font-size:13pt}
.missed .t small{display:block;color:var(--muted);font-size:11pt}
.empty{color:var(--muted);text-align:center;padding:20px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.code{font-size:44pt;letter-spacing:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Jungle theme (matches the student game) ===== */
:root{--night:#07140d;--torch:#f4e66b;--parch:#f4f0e2;--ink:#1d2a1f;--line:#d6cdb0;--sky:#e7efd2;--r1:#2f9e8f;--r2:#d9822b;--r3:#8a5cc7;color-scheme:dark}
body{background:radial-gradient(ellipse at 50% 0%,#1d4a2b 0%,#0c2416 45%,var(--night) 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#flies{position:fixed;inset:0;pointer-events:none;z-index:0}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco>div{position:absolute}
.wrap{position:relative;z-index:1}
.card{background:var(--parch);border:1px solid #c9bf98;box-shadow:0 0 0 4px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.55)}
.bar,.stat{background:rgba(6,18,10,.9);color:#eef3d6;border:1px solid rgba(183,227,90,.4);box-shadow:0 0 24px rgba(183,227,90,.12),0 6px 0 #020604}
.bar h1{color:var(--torch);text-shadow:0 0 12px rgba(244,230,107,.45);letter-spacing:.5px}
.bar .muted,.stat .muted{color:#c3cfa6}
.stat{color:#c3cfa6}
.stat b{color:var(--torch);text-shadow:0 0 10px rgba(244,230,107,.4)}
.btn{background:#12301c;box-shadow:0 4px 0 #061209}
.btn.go{background:#1f9d5c;box-shadow:0 4px 0 #13693c}
.btn.stop{background:#d9443c;box-shadow:0 4px 0 #962c27}
.btn.alt{background:var(--parch);color:var(--ink)}
.code{color:#1f6b3a}
.url{color:#1f6b3a}
.chip{background:#e7efd2;border:1px solid #c7d4a6}
td{border-bottom:1px solid #e1dbc2}
.track{background:#e4dfc8}
.st.playing{background:#e7efd2;color:#1f6b3a}
tr.top td{background:rgba(183,227,90,.16)}
tr.top:first-child td{background:rgba(244,230,107,.35)}
@media (max-width:560px){.deco .vine{display:none}}
.howto summary{cursor:pointer;font-weight:bold;font-size:16pt}
.howto ol{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.howto .zh{display:block;color:var(--muted)}
.howto .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
@media (max-width:900px){.howto .cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="flies" aria-hidden="true"></canvas>
<div class="deco" id="deco" aria-hidden="true"></div>
<div class="wrap" id="app"><div class="card"><p class="muted" style="margin:0">Connecting…</p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAEAb6WWNJJN7OAj1A5FVNUx7Y_vxpHhjw",authDomain:"f2-eng-tenses-live.firebaseapp.com",
  databaseURL:"https://f2-eng-tenses-live-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"f2-eng-tenses-live",
  storageBucket:"f2-eng-tenses-live.firebasestorage.app",messagingSenderId:"591157249024",appId:"1:591157249024:web:9e7aa1bd6b3c497a6104e5"});
const DB=firebase.database(),AUTH=firebase.auth(),TS=firebase.database.ServerValue.TIMESTAMP;
const GAME_URL="animal-fun-facts-maze.vercel.app";
const TOTAL=10, TOTAL_TIME=900, MAZE_Q=[4,4,2];
const QL=[["25","The blue whale makes the loudest sound of any animal.","Lines 6–7"],["26","Do cows stand while sleeping? Yes, they can sleep while standing up.","Lines 9–10"],
 ["27","By beating so quickly their wings, bees make a buzzing sound.","Lines 11–12"],["28","Sharks produce the biggest eggs in the world.","Lines 13–14"],
 ["29","A snake is watching through transparent eyelids.","Lines 14–15"],["30","Sheep have four stomachs to help them digest the food.","Line 17"],
 ["31","Do male mosquitoes bite humans? No, only female mosquitoes bite humans.","Lines 21–22"],["32","A cat uses its whiskers to check if it can fit through a space.","Line 24"],
 ["33","to produce or make → create","Line 5"],["34","furry, shaggy → fluffy","Line 9 / 18"]];
const QMAP={};QL.forEach(([id,full,lines],k)=>QMAP[id]={src:"Q"+id,full,lines,maze:k<4?1:k<8?2:3});
const ROOMC=["var(--r1)","var(--r2)","var(--r3)"];
const STLABEL={lobby:"Waiting",playing:"Playing",escaped:"Escaped",timeup:"Time up",stopped:"Stopped"};

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

let code=null, game=null, gref=null, uid=null;

AUTH.signInAnonymously().catch(err=>{app.innerHTML=`<div class="card"><h2>Could not connect</h2><p>${esc(err.message)}</p></div>`;});
let booted=false;
AUTH.onAuthStateChanged(u=>{if(!u)return;uid=u.uid;if(booted)return;booted=true;const saved=store.get("mazeTeacherGame");saved?watch(saved):home();});
async function freshAuth(force){if(force){try{await AUTH.signOut();}catch(e){}}if(!AUTH.currentUser)await AUTH.signInAnonymously();await AUTH.currentUser.getIdToken(true);return AUTH.currentUser.uid;}



function howTo(open){
  return `<div class="card howto"><details${open?" open":""}><summary>📖 How to play 怎么玩</summary><div class="cols">
   <div><h3>Students 学生</h3><ol>
    <li>Scan the QR code or open <b>${GAME_URL}</b>. Type the game code and your name, then tap <b>Join game</b>.<span class="zh">扫码或打开链接，输入游戏密码和名字，按 Join game。</span></li>
    <li>Move with the arrow keys, the buttons, or swipe. It is dark — you only see near you.<span class="zh">用方向键、按钮或滑动移动。丛林很暗，只能看到身边。</span></li>
    <li>Walk into a gate 🚪 to answer its question. Tap <b>📜 Passage</b> to read the text.<span class="zh">走到大门回答问题，按 📜 Passage 看文章。</span></li>
    <li>Pick the line where you found the answer to win a bonus key 🔑.<span class="zh">选出答案所在的行，赢得奖励钥匙。</span></li>
    <li>Open all gates and reach the exit ✨ in 3 mazes to find the treasure.<span class="zh">打开所有大门，走出 3 个迷宫，找到宝藏。</span></li>
   </ol></div>
   <div><h3>Rules 规则</h3><ol>
    <li>15 minutes. Wrong answer −15 s. Hint −10 s.<span class="zh">限时 15 分钟。答错扣 15 秒，看提示扣 10 秒。</span></li>
    <li>Correct first try +100, after a mistake +50, bonus key +50, firefly 🟡 +10.<span class="zh">第一次答对 +100，答错后答对 +50，钥匙 +50，萤火虫 +10。</span></li>
    <li>Short spelling slips get “Check your spelling” — no time lost.<span class="zh">小拼写错误会提示检查拼写，不扣时间。</span></li>
   </ol>
   <h3 style="margin-top:12px">Teacher 老师</h3><ol>
    <li><b>New game</b> → show the code / QR → <b>Start game</b> when everyone is in.<span class="zh">按 New game，投影密码/二维码，全员加入后按 Start game。</span></li>
    <li>Watch the live leaderboard. <b>End game</b> to finish, <b>Download results</b> for the scores.<span class="zh">看即时排行榜。按 End game 结束，Download results 下载成绩。</span></li>
   </ol></div></div></details></div>`;
}
function home(msg){
  stopWatch();code=null;game=null;store.set("mazeTeacherGame",null);
  app.innerHTML=`<div class="bar"><h1>Animal Maze · Teacher</h1></div>
   <div class="card" style="align-items:center;text-align:center;padding:40px 20px">
     <h2>Start a live game for your class</h2>
     <p class="muted" style="margin:0;max-width:52ch">You get a 6-digit code. Students open <b>${GAME_URL}</b>, type the code and a name, and you watch their scores live.</p>
     ${msg?`<p class="low" style="margin:0">${esc(msg)}</p>`:""}
     <button class="btn go" id="new">New game</button>
   </div>${howTo(true)}`;
  document.getElementById("new").onclick=newGame;
}

async function newGame(){
  const b=document.getElementById("new");if(b){b.disabled=true;b.textContent="Creating…";}
  const tryCreate=async()=>{
    for(let t=0;t<8;t++){
      const c=String(Math.floor(100000+Math.random()*900000));
      const ex=await DB.ref("games/"+c+"/status").get();
      if(ex.exists())continue;
      await DB.ref("games/"+c).update({owner:uid,status:"lobby",kind:"maze",createdAt:TS});
      store.set("mazeTeacherGame",c);watch(c);return true;
    }
    return false;
  };
  try{
    uid=await freshAuth(false);
    let ok;
    try{ok=await tryCreate();}
    catch(e){if(!/permission/i.test(e.message||""))throw e;uid=await freshAuth(true);ok=await tryCreate();}
    if(!ok)home("Could not create a game code. Please try again.");
  }catch(e){home("Could not create the game. Check your internet connection and try again. ("+(e.message||e)+")");}
}

function stopWatch(){if(gref)gref.off();gref=null;}
function watch(c){
  stopWatch();code=c;gref=DB.ref("games/"+c);
  gref.on("value",s=>{
    const g=s.val();
    if(g&&g.owner===uid&&g.kind!=="maze"){store.set("mazeTeacherGame",null);home("That code belongs to a different game.");return;}
    if(!g||g.owner!==uid){store.set("mazeTeacherGame",null);home(g?"That game belongs to another device.":"The game was closed.");return;}
    game=g;render();
  },()=>{store.set("mazeTeacherGame",null);home("Lost access to that game.");});
}

// Same names get a number so scores stay apart (Ali, Ali 2)
function players(){
  const ps=Object.entries(game.players||{}).map(([id,p])=>({id,...p}));
  ps.sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  const seen={};
  ps.forEach(p=>{const k=(p.name||"").trim().toLowerCase();seen[k]=(seen[k]||0)+1;p.label=seen[k]>1?`${p.name} ${seen[k]}`:p.name;});
  return ps;
}

function render(){
  const ps=players();
  if(game.status==="lobby")renderLobby(ps);else renderLive(ps);
}

function topBar(){
  const st=game.status;
  return `<div class="bar"><div class="row"><h1>Animal Maze · Teacher</h1>
     <span class="pill ${st}">${st==="lobby"?"Lobby":st==="live"?"Live":"Ended"}</span>
     <span class="muted">Code <b style="color:var(--torch);letter-spacing:2px">${esc(code)}</b></span></div>
   <div class="row">
     ${st==="lobby"?`<button class="btn go" id="start">Start game</button><button class="btn alt" id="cancel">Cancel</button>`:""}
     ${st==="live"?`<button class="btn stop" id="end">End game</button>`:""}
     ${st!=="lobby"?`<button class="btn alt" id="csv">Download results</button>`:""}
     ${st==="ended"?`<button class="btn" id="again">New game</button>`:""}
   </div></div>`;
}
function wireTop(ps){
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  on("start",()=>gref.update({status:"live",startedAt:TS}));
  on("cancel",()=>{if(confirm("Cancel this game? Students in the lobby will be sent back."))gref.remove().then(()=>home());});
  on("end",()=>{if(confirm("End the game for everyone now?"))gref.child("status").set("ended");});
  on("csv",()=>downloadCSV(ps));
  on("again",()=>{store.set("mazeTeacherGame",null);newGame();});
  document.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{
    const p=ps.find(x=>x.id===b.dataset.kick);
    if(confirm(`Remove ${p?p.label:"this student"} from the game?`))gref.child("players/"+b.dataset.kick).remove();
  });
}

function qrSVG(text){
  if(typeof qrcode==="undefined")return "";
  const q=qrcode(0,"M");q.addData(text);q.make();
  return q.createSvgTag({cellSize:8,margin:2,scalable:true});
}
function renderLobby(ps){
  app.innerHTML=`${topBar()}
   <div class="card join">
     <div class="qr">${qrSVG("https://"+GAME_URL+"/?code="+code)}<span class="muted">Scan to join · 扫码加入</span></div>
     <div class="codebox">
       <span class="muted">or go to</span><span class="url">${GAME_URL}</span>
       <span class="muted">and enter the game code</span>
       <span class="code">${esc(code)}</span>
     </div>
   </div>
   <div class="card"><div class="row" style="justify-content:space-between"><h2>Students joined: ${ps.length}</h2>
     <span class="muted">Press Start when everyone is in. 全部加入后按 Start。</span></div>
     <div class="chips">${ps.length?ps.map(p=>`<span class="chip"><span class="dot ${p.online===false?"off":""}"></span>${esc(p.label)}<button data-kick="${p.id}" aria-label="Remove ${esc(p.label)}">×</button></span>`).join(""):`<span class="muted">Waiting for students to join…</span>`}</div>
   </div>${howTo(false)}`;
  wireTop(ps);
}

function renderLive(ps){
  const ranked=[...ps].sort((a,b)=>(b.score||0)-(a.score||0)||(b.correct||0)-(a.correct||0)||(b.timeLeft||0)-(a.timeLeft||0));
  const done=ps.filter(p=>p.state==="escaped").length;
  const playing=ps.filter(p=>p.state==="playing").length;
  const avg=ps.length?Math.round(ps.reduce((s,p)=>s+(p.score||0),0)/ps.length):0;
  const miss={};ps.forEach(p=>Object.keys(p.missed||{}).forEach(k=>miss[k]=(miss[k]||0)+1));
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
  app.innerHTML=`${topBar()}
   <div class="stats">
     <div class="stat">Students<b>${ps.length}</b></div>
     <div class="stat">Still playing<b>${playing}</b></div>
     <div class="stat">Escaped<b>${done}</b></div>
     <div class="stat">Average score<b>${avg}</b></div>
   </div>
   <div class="grid">
     <div class="card"><h2>Live leaderboard</h2>
       <div class="tablewrap"><table>
         <thead><tr><th>#</th><th>Name</th><th>Progress</th><th>Keys 🔑</th><th>Score</th><th>1st-try wrong</th><th>Time left</th><th>Status</th><th></th></tr></thead>
         <tbody>${ranked.length?ranked.map((p,i)=>{
           const c=p.correct||0,room=Math.min(3,(p.maze||0)+1);let left=c;
           const segs=MAZE_Q.map((n0,r)=>{const n=Math.max(0,Math.min(n0,left));left-=n;return `<i style="width:${n/TOTAL*100}%;background:${ROOMC[r]}"></i>`;}).join("");
           const st=p.state||"lobby";
           return `<tr class="${i<3?"top":""}"><td class="rank">${i+1}</td>
             <td class="name"><span class="dot ${p.online===false?"off":""}"></span>${esc(p.label)}</td>
             <td class="prog"><div class="track">${segs}</div><small>${c}/10 gates · ${st==="escaped"?"Done":"Maze "+room}</small></td>
             <td>${p.keys||0}/10</td><td><b>${p.score||0}</b>${p.stars?` <span style="color:#c99a17">${"★".repeat(p.stars)}</span>`:""}</td>
             <td>${p.wrong||0}</td>
             <td class="${(p.timeLeft??TOTAL_TIME)<=60&&st==="playing"?"low":""}">${st==="escaped"&&p.timeUsed!=null?"used "+fmt(p.timeUsed):fmt(p.timeLeft??TOTAL_TIME)}</td>
             <td><span class="st ${st}">${STLABEL[st]||st}</span></td>
             <td><button class="x" data-kick="${p.id}" aria-label="Remove ${esc(p.label)}">×</button></td></tr>`;}).join(""):`<tr><td colspan="9" class="empty">No students joined this game.</td></tr>`}</tbody>
       </table></div>
     </div>
     <div class="card"><h2>Most missed questions</h2>
       <p class="muted" style="margin:0;font-size:12pt">Students who got it wrong on the first try</p>
       ${top.length?`<ul class="missed">${top.map(([k,n])=>{const q=QMAP[k]||{src:k,full:""};return `<li><span class="n">${n}</span><span class="t"><b>${esc(q.src)}</b> · Maze ${q.maze} · ${esc(q.lines||"")}<small>${esc(q.full)}</small></span></li>`;}).join("")}</ul>`:`<p class="empty" style="margin:0">No mistakes yet.</p>`}
     </div>
   </div>`;
  wireTop(ps);
}

function downloadCSV(ps){
  const ranked=[...ps].sort((a,b)=>(b.score||0)-(a.score||0));
  const rows=[["Rank","Name","Status","Score","Stars","Gates opened (of 10)","Bonus keys (of 10)","First-try wrong","Time left","Time used","Questions missed first try"]];
  ranked.forEach((p,i)=>rows.push([i+1,p.label,STLABEL[p.state]||p.state||"",p.score||0,p.stars||"",p.correct||0,p.keys||0,p.wrong||0,
    fmt(p.timeLeft??TOTAL_TIME),p.timeUsed!=null?fmt(p.timeUsed):"",Object.keys(p.missed||{}).map(k=>(QMAP[k]||{}).src||k).join(" ")]));
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const d=new Date();a.download=`animal-maze-${code}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.csv`;
  document.body.appendChild(a);a.click();a.remove();
}
</script>
<script>
(function(){
  const vine=(h)=>`<svg class="vine" width="70" height="${h}" viewBox="0 0 70 ${h}"><path d="M35 0 C10 ${h*.2} 60 ${h*.4} 30 ${h*.6} S40 ${h*.9} 32 ${h}" stroke="#1f4d2a" stroke-width="5" fill="none"/>${
    Array.from({length:Math.floor(h/46)},(_,i)=>{const y=20+i*46,x=i%2?44:22,r=i%2?30:-30;return `<path d="M${x} ${y} q14 -14 26 0 q-14 14 -26 0z" fill="${i%3?"#2f6b3a":"#3f8a45"}" transform="rotate(${r} ${x} ${y})"/>`;}).join("")}</svg>`;
  const leaf=(c,r)=>`<svg width="160" height="160" viewBox="0 0 160 160" style="transform:rotate(${r}deg)"><path d="M80 150 C10 120 10 40 80 10 C150 40 150 120 80 150Z" fill="${c}"/><path d="M80 150 V18" stroke="#0c2416" stroke-width="4"/></svg>`;
  const items=[[vine(320),0.5,0],[vine(240),93,0],[leaf("#163c22",-30),-4,74],[leaf("#1b4628",35),90,80]];
  document.getElementById("deco").innerHTML=items.map(([s,x,y])=>`<div class="${s.includes('class="vine"')?"vine":""}" style="left:${x}%;top:${y}%">${s}</div>`).join("");
  const c=document.getElementById("flies");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const x=c.getContext("2d");let W,H;const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};fit();addEventListener("resize",fit);
  const ps=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:1.2+Math.random()*2,vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0006,d:Math.random()*6}));
  (function f(){x.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx+Math.sin(p.d)*.0004;p.y+=p.vy+Math.cos(p.d*.7)*.0003;p.d+=.015;
    if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;
    const a=Math.max(0,Math.sin(p.d*2.2)),g=x.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.r*5);
    g.addColorStop(0,`rgba(244,240,120,${.9*a})`);g.addColorStop(1,"rgba(183,227,90,0)");x.fillStyle=g;x.beginPath();x.arc(p.x*W,p.y*H,p.r*5,0,7);x.fill();}
    requestAnimationFrame(f);})();
})();
</script>
